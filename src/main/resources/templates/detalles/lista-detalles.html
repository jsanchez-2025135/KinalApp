<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/detalle.css}">
    <title>Detalles de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Detalles de la Venta #[[${codigoVenta}]]</h2>

    <a th:href="@{/detalles/nuevo/{id}(id=${codigoVenta})}" class="btn btn-primary mb-3">
        + Agregar Producto
    </a>

    <table class="table table-bordered table-hover">
        <thead class="table-info">
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Subtotal</th>
            <th th:if="${isAdmin}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${detalles}" th:if="${detalles.size() > 0}">
            <td th:text="${d.producto.nombreProducto}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="${'Q' + d.precioUnitario}"></td>
            <td th:text="${'Q' + d.subtotal}"></td>
            <td th:if="${isAdmin}">
                <a th:href="@{/detalles/eliminar/{id}(id=${d.codigoDetalleVenta})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este producto de la venta? Se repondrá el stock.')">
                    Eliminar
                </a>
            </td>
        </tr>
        <tr th:if="${detalles.size() == 0}">
            <td colspan="4" class="text-center text-muted">
                No hay productos agregados a esta venta.
                <br>
                <a th:href="@{/detalles/nuevo/{id}(id=${codigoVenta})}" class="btn btn-sm btn-primary mt-2">
                    Agregar producto
                </a>
            </td>
        </tr>
        </tbody>
        <tfoot th:if="${detalles.size() > 0}">
        <tr class="table-success">
            <td colspan="3" class="text-end fw-bold">TOTAL:</td>
            <td class="fw-bold text-success">
                Q <span th:text="${#numbers.formatDecimal(totalVenta, 1, 2)}"></span>
            </td>
            <td th:if="${isAdmin}"></td>
        </tr>
        </tfoot>
    </table>

    <div class="mt-3">
        <a th:href="@{/ventas}" class="btn btn-secondary">← Volver a Ventas</a>
        <a th:href="@{/menu}" class="btn btn-outline-primary ms-2">🏠 Ir al Menú</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
