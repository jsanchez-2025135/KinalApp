<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <link rel="stylesheet" th:href="@{/detalle.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow col-md-6 mx-auto">
        <div class="card-header bg-info text-white">
            <h4>Seleccionar Producto</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/detalles/guardar/{id}(id=${codigoVenta})}"
                  th:object="${detalle}"
                  method="post">

                <div class="mb-3">
                    <label>Producto</label>
                    <select th:field="*{producto.codigoProducto}" class="form-select" required>
                        <option value="">Seleccione un producto</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.codigoProducto}"
                                th:text="${p.nombreProducto}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Cantidad</label>
                    <input type="number" th:field="*{cantidad}" class="form-control" required min="1">
                </div>

                <div class="mb-3">
                    <label>Precio Unitario</label>
                    <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Subtotal</label>
                    <input type="number" step="0.01" th:field="*{subtotal}" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Agregar</button>
                <a th:href="@{/detalles/venta/{id}(id=${codigoVenta})}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
