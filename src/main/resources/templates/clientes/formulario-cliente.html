<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cliente.css}">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${titulo}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                        <div class="mb-3">
                            <label class="form-label">DPI del Cliente</label>
                            <input type="text" th:field="*{dpiCliente}" class="form-control" th:classappend="${#fields.hasErrors('dpiCliente')} ? 'is-invalid' : ''" th:readonly="${cliente.dpiCliente != null}">
                            <div th:if="${#fields.hasErrors('dpiCliente')}" th:errors="*{dpiCliente}" class="invalid-feedback"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombreCliente}" class="form-control" th:classappend="${#fields.hasErrors('nombreCliente')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('nombreCliente')}" th:errors="*{nombreCliente}" class="invalid-feedback"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellidoCliente}" class="form-control" th:classappend="${#fields.hasErrors('apellidoCliente')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('apellidoCliente')}" th:errors="*{apellidoCliente}" class="invalid-feedback"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control" th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''">
                            <div th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="invalid-feedback"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select th:field="*{estado}" class="form-select" th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid' : ''">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                            <div th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}" class="invalid-feedback"></div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Cliente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
