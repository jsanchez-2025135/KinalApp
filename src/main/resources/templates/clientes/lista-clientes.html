<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cliente.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/menu}">KinalApp - Volver al Menú</a>
    </div>
</nav>

<div class="container">
    <div th:if="${mensaje}" th:class="'alert alert-' + ${tipoMensaje} + ' alert-dismissible fade show'" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Lista de Clientes</h2>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">Agregar Nuevo Cliente</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.dpiCliente}"></td>
            <td th:text="${c.nombreCliente}"></td>
            <td th:text="${c.apellidoCliente}"></td>
            <td th:text="${c.direccion}"></td>
            <td>
                <span th:if="${c.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${c.estado == 0}" class="badge bg-danger">Inactivo</span>
            </td>
            <td>
                <div th:if="${isAdmin}">
                    <a th:href="@{/clientes/editar/{id}(id=${c.dpiCliente})}" class="btn btn-warning btn-sm">Editar</a>

                    <!-- Botón para cambiar estado manualmente -->
                    <a th:if="${c.estado == 1}"
                       th:href="@{/clientes/cambiar-estado/{id}(id=${c.dpiCliente})}"
                       class="btn btn-secondary btn-sm"
                       onclick="return confirm('¿Desactivar este cliente?')">
                        Desactivar
                    </a>

                    <a th:if="${c.estado == 0}"
                       th:href="@{/clientes/cambiar-estado/{id}(id=${c.dpiCliente})}"
                       class="btn btn-success btn-sm"
                       onclick="return confirm('¿Activar este cliente?')">
                        Activar
                    </a>

                    <a th:href="@{/clientes/eliminar/{id}(id=${c.dpiCliente})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar/Desactivar este cliente?')">
                        Eliminar
                    </a>
                </div>
                <div th:unless="${isAdmin}">
                    <span class="text-muted">Solo lectura</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
