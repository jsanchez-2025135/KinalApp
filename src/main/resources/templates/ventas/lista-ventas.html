<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/venta.css}">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Ventas</h2>
        <div>
            <a th:href="@{/ventas/nuevo}" class="btn btn-primary me-2">
                + Nueva Venta
            </a>
            <a th:href="@{/menu}" class="btn btn-secondary">
                ← Regresar al Menú
            </a>
        </div>
    </div>

    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.codigoVenta}"></td>
            <td th:text="${v.fechaVenta}"></td>
            <td th:text="${'Q' + v.total}"></td>
            <td>
                <span th:if="${v.estado == 1}" class="badge bg-success">Activa</span>
                <span th:if="${v.estado == 0}" class="badge bg-danger">Anulada</span>
            </td>
            <td>

                <a th:href="@{/detalles/venta/{id}(id=${v.codigoVenta})}" class="btn btn-info btn-sm">
                    Ver Detalle
                </a>


                <div th:if="${isAdmin and v.estado == 1}" class="mt-1">
                    <a th:href="@{/ventas/anular/{id}(id=${v.codigoVenta})}"
                       class="btn btn-warning btn-sm"
                       onclick="return confirm('¿Anular esta venta? Se mantendrá el registro para auditoría.')">
                        Anular Venta
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/ventas/nuevo}" class="btn btn-primary">
            + Crear Nueva Venta
        </a>
        <a th:href="@{/menu}" class="btn btn-outline-secondary ms-2">
            ← Volver al Menú Principal
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
