<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta</title>
    <link rel="stylesheet" th:href="@{/venta.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Venta</h4>
        </div>
        <div class="card-body">
            <!-- IMPORTANTE: th:action debe apuntar a /ventas/guardar -->
            <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
                <div class="mb-3">
                    <label>Fecha</label>
                    <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Cliente</label>
                    <select th:field="*{cliente.dpiCliente}" class="form-select" required>
                        <option value="">Seleccione un cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.dpiCliente}" th:text="${c.nombreCliente}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Usuario</label>
                    <select th:field="*{usuario.codigoUsuario}" class="form-select" required>
                        <option value="">Seleccione un usuario</option>
                        <option th:each="u : ${usuarios}" th:value="${u.codigoUsuario}" th:text="${u.username}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Total</label>
                    <input type="number" step="0.01" th:field="*{total}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Finalizar Venta</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
